<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <title>phIA</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }


    /* =========================
       CABEÇALHO
       ========================= */

    .header {
      height: 60px;
      border-bottom: 1px solid #252525;

      display: flex;
      align-items: center;

      padding: 0 25px;

      font-size: 21px;
      font-weight: bold;

      color: #f5c400;
    }


    /* =========================
       ÁREA DO CHAT
       ========================= */

    .chat {
      flex: 1;

      overflow-y: auto;

      padding: 30px 20px 120px 20px;
    }

    .messages {
      max-width: 850px;
      margin: auto;
    }


    /* =========================
       MENSAGEM
       ========================= */

    .message {
      margin-bottom: 25px;

      font-size: 16px;
      line-height: 1.6;
    }


    /* =========================
       USUÁRIO
       ========================= */

    .user {
      display: flex;
      justify-content: flex-end;
    }

    .user .text {
      max-width: 70%;

      background: #2f2f2f;

      color: #ffffff;

      padding: 12px 16px;

      border-radius: 18px;

      white-space: pre-wrap;
    }


    /* =========================
       PHIA
       ========================= */

    .phia {
      display: block;
    }

    .phia .name {
      color: #f5c400;

      font-weight: bold;

      margin-bottom: 7px;
    }

    .phia .text {
      color: #ffffff;

      max-width: 85%;

      white-space: pre-wrap;
    }


    /* =========================
       ÁREA DE ENVIO
       ========================= */

    .input-area {
      position: fixed;

      bottom: 0;
      left: 0;
      right: 0;

      background: #000000;

      border-top: 1px solid #252525;

      padding: 15px;
    }

    .input-container {
      max-width: 850px;

      margin: auto;

      display: flex;

      gap: 10px;

      align-items: flex-end;
    }


    /* =========================
       CAMPO DE TEXTO
       ========================= */

    textarea {

      flex: 1;

      min-height: 52px;
      max-height: 150px;

      resize: none;

      padding: 14px 16px;

      background: #1f1f1f;

      color: #ffffff;

      border: 1px solid #3a3a3a;

      border-radius: 15px;

      outline: none;

      font-family: Arial, sans-serif;

      font-size: 16px;

    }

    textarea::placeholder {
      color: #888888;
    }

    textarea:focus {
      border-color: #555555;
    }


    /* =========================
       BOTÃO ENVIAR
       ========================= */

    button {

      height: 52px;

      padding: 0 22px;

      border: none;

      border-radius: 15px;

      background: #f5c400;

      color: #000000;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;

    }

    button:hover {
      background: #ffd633;
    }

    button:disabled {
      background: #665a00;
      color: #222222;
      cursor: not-allowed;
    }


    /* =========================
       ROLAGEM
       ========================= */

    .chat::-webkit-scrollbar {
      width: 8px;
    }

    .chat::-webkit-scrollbar-track {
      background: #000000;
    }

    .chat::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 10px;
    }


    /* =========================
       CELULAR
       ========================= */

    @media (max-width: 600px) {

      .header {
        padding: 0 15px;
      }

      .chat {
        padding: 20px 12px 110px 12px;
      }

      .user .text {
        max-width: 85%;
      }

      .phia .text {
        max-width: 100%;
      }

      .input-area {
        padding: 10px;
      }

      .input-container {
        gap: 7px;
      }

      button {
        padding: 0 16px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       CABEÇALHO
       ========================= -->

  <div class="header">
    phIA
  </div>


  <!-- =========================
       CHAT
       ========================= -->

  <div class="chat">

    <div class="messages" id="messages">


      <!-- MENSAGEM INICIAL DA PHIA -->

      <div class="message phia">

        <div class="name">
          phIA
        </div>

        <div class="text">
          Olá! Eu sou a phIA.
          Ainda estou no começo, mas vamos construir minha inteligência juntos.
        </div>

      </div>


    </div>

  </div>


  <!-- =========================
       ÁREA DE ENVIO
       ========================= -->

  <div class="input-area">

    <div class="input-container">

      <textarea
        id="pergunta"
        placeholder="Digite sua mensagem..."
        rows="1"
        onkeydown="teclaEnter(event)"
      ></textarea>

      <button
        id="enviar"
        onclick="perguntar()"
      >
        Enviar
      </button>

    </div>

  </div>


  <script>


    // =========================
    // ENVIAR PERGUNTA
    // =========================

    function perguntar() {

      const campo =
        document.getElementById("pergunta");

      const botao =
        document.getElementById("enviar");

      const pergunta =
        campo.value.trim();


      if (!pergunta) {
        return;
      }


      // Adiciona pergunta do usuário

      adicionarMensagem(
        "user",
        pergunta
      );


      // Limpa campo

      campo.value = "";


      // Desabilita botão

      botao.disabled = true;

      botao.innerText = "...";


      // Mostra PHIA pensando

      adicionarMensagem(
        "phia",
        "Pensando..."
      );


      // Envia para o Google Apps Script

      google.script.run

        .withSuccessHandler(function(resultado) {

          removerUltimaMensagem();

          adicionarMensagem(
            "phia",
            resultado
          );

          botao.disabled = false;

          botao.innerText = "Enviar";

          campo.focus();

        })


        .withFailureHandler(function(erro) {

          removerUltimaMensagem();

          adicionarMensagem(
            "phia",
            "Ocorreu um erro: " + erro.message
          );

          botao.disabled = false;

          botao.innerText = "Enviar";

          campo.focus();

        })


        .perguntarPHIA(pergunta);

    }


    // =========================
    // ADICIONAR MENSAGEM
    // =========================

    function adicionarMensagem(tipo, texto) {

      const messages =
        document.getElementById("messages");


      const div =
        document.createElement("div");

      div.className =
        "message " + tipo;


      if (tipo === "user") {

        div.innerHTML =
          '<div class="text">' +
          escaparHTML(texto) +
          '</div>';

      }

      else {

        div.innerHTML =
          '<div class="name">phIA</div>' +
          '<div class="text">' +
          escaparHTML(texto) +
          '</div>';

      }


      messages.appendChild(div);


      // Vai para a última mensagem

      const chat =
        document.querySelector(".chat");

      chat.scrollTop =
        chat.scrollHeight;

    }


    // =========================
    // REMOVER "PENSANDO..."
    // =========================

    function removerUltimaMensagem() {

      const messages =
        document.getElementById("messages");

      if (messages.lastElementChild) {

        messages.removeChild(
          messages.lastElementChild
        );

      }

    }


    // =========================
    // ENTER ENVIA
    // SHIFT + ENTER QUEBRA LINHA
    // =========================

    function teclaEnter(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        perguntar();

      }

    }


    // =========================
    // PROTEÇÃO HTML
    // =========================

    function escaparHTML(texto) {

      const div =
        document.createElement("div");

      div.textContent =
        texto;

      return div.innerHTML;

    }


  </script>

</body>

</html>
